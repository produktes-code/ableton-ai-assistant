name: Antigravity V2.0.0 Build
on:
  push:
    branches: [ feature/v2.0.0-upgrade, main ]
  pull_request:
    branches: [ main ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest numpy sounddevice websockets
    - name: Run tests
      run: |
        python -m pytest tests/unit/ -v
