name: CI - Ableton AI Assistant

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]


permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Run pip-audit
        run: pip-audit -r mcp-server/requirements.txt

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: |
          pip install pytest numpy websockets sounddevice
      - name: Run tests
        run: |
          python -m pytest \
            tests/unit/ \
            tests/ui/ \
            tests/integration/ \
            -v --tb=short \
            --ignore=tests/unit/test_dsp_engine.py \
            -p no:warnings
        env:
          PYTHONPATH: remote-script
      - name: Run DSP tests with numpy
        run: |
          python -m pytest \
            tests/unit/test_dsp_engine.py \
            -v --tb=short
        env:
          PYTHONPATH: remote-script

  electron-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./electron-app
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './electron-app/package-lock.json'
      - name: Install dependencies
        run: npm ci || npm install
      - name: Run electron tests
        run: npm test
