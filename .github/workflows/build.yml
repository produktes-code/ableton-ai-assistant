name: Build Antigravity Installers

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        include:
          - os: macos-latest
            artifact_name: "*.dmg"
            artifact_label: antigravity-macos
          - os: windows-latest
            artifact_name: "*.exe"
            artifact_label: antigravity-windows
          - os: ubuntu-latest
            artifact_name: "*.{AppImage,deb}"
            artifact_label: antigravity-linux
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install system dependencies (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            rpm \
            fakeroot \
            dpkg \
            icnsutils \
            graphicsmagick \
            libopenjp2-tools

      - name: Install npm dependencies
        working-directory: ./electron-app
        run: npm install

      - name: Build Installers
        working-directory: ./electron-app
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: electron-app/dist/${{ matrix.artifact_name }}

  package-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Backend Archive
        run: |
          mkdir -p backend-archive/Ableton.AI.Assistant-Backend
          cp -r remote-script backend-archive/Ableton.AI.Assistant-Backend/
          cp -r mcp-server backend-archive/Ableton.AI.Assistant-Backend/
          cp docs/USER_MANUAL.pdf backend-archive/Ableton.AI.Assistant-Backend/
          cd backend-archive
          zip -r Ableton.AI.Assistant-Backend-V2.0.2.zip Ableton.AI.Assistant-Backend

      - name: Upload Backend to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} backend-archive/Ableton.AI.Assistant-Backend-V2.0.2.zip --clobber
