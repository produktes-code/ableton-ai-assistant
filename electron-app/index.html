<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' ws://127.0.0.1:9002; script-src 'self'; style-src 'self' 'unsafe-inline';">
  <title>Antigravity V2.0.0</title>
  <link rel="stylesheet" href="styles/glassmorphism.css">
</head>
<body>
  <header class="status-bar glass-panel">
    <div class="status-left">
      <div id="tcp-dot" class="dot"></div>
      <span id="tcp-label">Desconectado</span>
    </div>
    <div class="status-metrics">
      BPM: <span id="bpm-value" class="metric-value">120</span> | 
      KEY: <span id="key-value" class="metric-value">C</span> | 
      LUFS: <span id="lufs-value" class="metric-value">-14</span> | 
      CLARITY: <span id="clash-value" class="metric-value">0%</span>
    </div>
    <div class="status-right badge">Antigravity V2.0.0</div>
  </header>

  <main class="main-grid">
    <section class="col glass-panel glass-inset">
      <h2>DSP Engine</h2>
      <canvas id="spectrogram-canvas" class="spectrogram-canvas" width="290" height="180"></canvas>
      <div class="band-labels">
        <span>SUB</span><span>BASS</span><span>LO-MID</span><span>MID</span><span>HI-MID</span><span>PRES</span><span>AIR</span><span>ULTRA</span>
      </div>
      <div class="meter-bar-container">
        <div id="clash-meter-fill" class="meter-bar"></div>
      </div>
      <canvas id="chroma-canvas" width="290" height="80"></canvas>
      <button id="freeze-btn">Freeze</button>
      <select>
        <option>View 1</option>
      </select>
    </section>

    <section class="col glass-panel">
      <div class="chat-header">
        <select>
          <option>Claude 3.5</option>
          <option>GPT-4o</option>
          <option>LLM Local</option>
        </select>
      </div>
      <div id="chat-history" class="chat-history">
        <div class="message assistant-msg">
          <div class="msg-content">
            <p>🎵 Bienvenido. Puedes empezar con algo como:</p>
            <div class="suggestions">
              <button class="suggestion-chip" onclick="sendSuggestion(this)">Crea una bateria house en 124bpm</button>
              <button class="suggestion-chip" onclick="sendSuggestion(this)">Analiza mi mezcla</button>
              <button class="suggestion-chip" onclick="sendSuggestion(this)">Lista todas las pistas</button>
              <button class="suggestion-chip" onclick="sendSuggestion(this)">Genera melodia en Fa menor</button>
            </div>
          </div>
        </div>
      </div>
      <div class="chat-input-area">
        <textarea id="chat-input" placeholder="Escribe aquí..."></textarea>
        <button id="send-btn" class="btn-send">Enviar</button>
        <button id="attach-audio-btn">Audio</button>
        <button id="attach-sample-btn">Sample</button>
      </div>
    </section>

    <section class="col glass-panel glass-inset">
      <div class="transport-controls">
        <button id="btn-play" class="btn-transport" onclick="transport('play')">Play</button>
        <button id="btn-stop" class="btn-transport" onclick="transport('stop')">Stop</button>
        <button id="btn-record" class="btn-transport" onclick="transport('record')">Rec</button>
      </div>
      <div class="session-info">
        <h3>Tracks</h3>
        <button id="refresh-session">Sync</button>
        <span id="queue-count">0</span>
      </div>
      <div id="tracks-view"></div>
    </section>
  </main>

  <footer class="log-terminal glass-panel">
    <div class="terminal-controls">
      <button onclick="clearLog()">Clear</button>
      <button onclick="toggleTerminal()">Toggle</button>
    </div>
    <div id="terminal-output"></div>
  </footer>

  <script src="js/tcp-client.js"></script>
  <script src="js/dsp-visualizer.js"></script>
  <script src="js/session-sync.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
